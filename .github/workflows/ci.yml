---
name: CI

"on":
  push:
    branches:
      - ansible-core-2.20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The role is checked out into a directory named after its role name, so
# `include_role: realtime.logrotate` resolves through ANSIBLE_ROLES_PATH.
defaults:
  run:
    working-directory: realtime.logrotate

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: realtime.logrotate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.logrotate/molecule/requirements.txt

      - name: Install lint tools
        run: pip install pre-commit "ansible-core>=2.20,<2.21" ansible-lint

      - name: Install the role's collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('realtime.logrotate/.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Run pre-commit
        run: pre-commit run --all-files

  # One job per supported OS release. The platform names are the ones in
  # molecule/<scenario>/molecule.yml. default covers every release the role
  # claims; unowned covers the branch where no drop-in owns wtmp and btmp.
  molecule:
    name: Molecule ${{ matrix.scenario }} / ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scenario: default, platform: ubuntu-jammy}
          - {scenario: default, platform: ubuntu-noble}
          - {scenario: default, platform: ubuntu-resolute}
          - {scenario: default, platform: debian-trixie}
          - {scenario: default, platform: rockylinux-9}
          - {scenario: default, platform: opensuse-leap15}
          - {scenario: unowned, platform: ubuntu-noble}
          - {scenario: unowned, platform: rockylinux-9}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          path: realtime.logrotate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: realtime.logrotate/molecule/requirements.txt

      - name: Install Ansible and molecule
        run: pip install -r molecule/requirements.txt "ansible-core>=2.20,<2.21"

      # ansible-core alone has neither collection: community.docker drives the
      # molecule containers and community.general.zypper installs on SUSE.
      - name: Install collections
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-galaxy collection install community.docker

      - name: Run molecule test
        run: molecule test -s ${{ matrix.scenario }} --platform-name ${{ matrix.platform }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          ANSIBLE_DEPRECATION_WARNINGS: "0"
          # molecule-plugins' create.yml has a non-boolean `when:`, which
          # ansible-core 2.19+ rejects unless this is set.
          ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "true"
