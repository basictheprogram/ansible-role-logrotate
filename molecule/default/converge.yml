---
- name: Converge
  hosts: all
  become: true

  environment:
    TZ: "America/Chicago"
    DEBIAN_FRONTEND: "noninteractive"

  vars:
    logrotate_options:
      - weekly
      - su root root
      - rotate 32
      - create
      - dateext
      - compress

    logrotate_applications:
      - name: mysql-backup
        definitions:
          - logs:
              - /var/backup/mysql/*.log
            options:
              - rotate 12
              - monthly
              - missingok
              - notifempty
              - compress
              - delaycompress

  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
      changed_when: false
      when: ansible_facts.os_family == 'Debian'
    - name: Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
      when: ansible_facts.os_family == 'RedHat'

  tasks:
    - name: Include role realtime.logrotate
      ansible.builtin.include_role:
        name: realtime.logrotate
