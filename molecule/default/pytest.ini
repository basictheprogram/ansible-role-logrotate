[pytest]
# The role sits inside the playbooks repo, whose pytest.ini sets coverage and
# Django options that do not apply to molecule/testinfra. A pytest.ini closer to
# the tests takes precedence over it.
#
# pytest_molecule imports the pipes module, which Python 3.14 removed, so the
# plugin fails to load. Molecule's testinfra verifier does not need it.
#
# pytest-ansible and pytest-testinfra both register --ansible-inventory and
# clash when both are installed (as in the devcontainer). Only testinfra is used.
addopts = -p no:molecule -p no:pytest-ansible
