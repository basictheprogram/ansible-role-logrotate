---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Assert logrotate is installed
      ansible.builtin.assert:
        that:
          - "'logrotate' in ansible_facts.packages"
        fail_msg: "logrotate package is not installed"
        success_msg: "logrotate package is installed"

    - name: Assert /etc/logrotate.conf exists
      ansible.builtin.stat:
        path: /etc/logrotate.conf
      register: logrotate_conf_stat

    - name: Assert logrotate.conf is present and owned by root
      ansible.builtin.assert:
        that:
          - logrotate_conf_stat.stat.exists
          - logrotate_conf_stat.stat.pw_name == 'root'
          - logrotate_conf_stat.stat.mode == '0644'
        fail_msg: "/etc/logrotate.conf missing or has wrong ownership/permissions"
        success_msg: "/etc/logrotate.conf exists with correct ownership and permissions"

    - name: Read /etc/logrotate.conf
      ansible.builtin.slurp:
        src: /etc/logrotate.conf
      register: logrotate_conf_content

    - name: Assert logrotate.conf leaves wtmp and btmp to their drop-ins
      ansible.builtin.assert:
        that:
          - "'/var/log/wtmp' not in (logrotate_conf_content.content | b64decode)"
          - "'/var/log/btmp' not in (logrotate_conf_content.content | b64decode)"
        fail_msg: "logrotate.conf redefines wtmp or btmp that a drop-in already owns"
        success_msg: "logrotate.conf does not duplicate the wtmp and btmp drop-ins"

    - name: Assert logrotate runs without error
      ansible.builtin.command:
        cmd: logrotate --debug /etc/logrotate.conf
      register: logrotate_debug_run
      changed_when: false
      failed_when: logrotate_debug_run.rc != 0
