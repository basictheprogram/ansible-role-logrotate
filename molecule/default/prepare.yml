---
- name: Prepare molecule test host
  hosts: all
  become: true

  vars:
    prepare_packages:
      - dialog
      - less
      - logrotate
      - vim-tiny

  environment:
    TZ: "America/Chicago"
    DEBIAN_FRONTEND: "noninteractive"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        force_apt_get: true
        autoremove: true
        autoclean: true
      changed_when: false
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install prepare packages
      ansible.builtin.apt:
        name: "{{ prepare_packages }}"
        state: present
        install_recommends: false
        force_apt_get: true
      when: ansible_facts['os_family'] == 'Debian'

    # Newer Debian/Ubuntu logrotate packages already ship these. Seed them
    # when the image's package does not, so the role always meets drop-ins
    # that own wtmp and btmp.
    - name: Ensure drop-ins that own wtmp and btmp exist
      ansible.builtin.copy:
        dest: "/etc/logrotate.d/{{ item.name }}"
        content: |
          {{ item.log }} {
              missingok
              monthly
              create {{ item.create }}
              rotate 1
          }
        owner: root
        group: root
        mode: "0644"
        force: false
      loop:
        - {name: wtmp, log: /var/log/wtmp, create: "0664 root utmp"}
        - {name: btmp, log: /var/log/btmp, create: "0660 root utmp"}
