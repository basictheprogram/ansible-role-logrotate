---
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Read /etc/logrotate.conf
      ansible.builtin.slurp:
        src: /etc/logrotate.conf
      register: logrotate_conf_content

    - name: Assert logrotate.conf defines wtmp and btmp itself
      ansible.builtin.assert:
        that:
          - "'/var/log/wtmp {' in (logrotate_conf_content.content | b64decode)"
          - "'/var/log/btmp {' in (logrotate_conf_content.content | b64decode)"
        fail_msg: "logrotate.conf is missing the wtmp or btmp block"
        success_msg: "logrotate.conf defines wtmp and btmp when no drop-in does"

    - name: Assert logrotate runs without error
      ansible.builtin.command:
        cmd: /usr/sbin/logrotate --debug /etc/logrotate.conf
      changed_when: false
