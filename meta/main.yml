---
# No role dependencies — this role is self-contained.
# Previously depended on realtime.logrotate_core, which has been consolidated
# into this role as of 2026-05-21.
dependencies: []

galaxy_info:
  namespace: realtime
  author: "Bob Tanner"
  role_name: logrotate
  description: >
    Ansible role to install and configure logrotate on Debian/Ubuntu,
    Red Hat/Rocky/Alma, and SUSE/openSUSE. Fork of arillso/ansible.logrotate
    (https://github.com/arillso/ansible.logrotate), taken over 2026-05-21
    following upstream archival.
  license: "MIT"
  min_ansible_version: "2.20"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
        - resolute
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: EL
      versions:
        - "8"
        - "9"
    - name: opensuse
      versions:
        - all
  galaxy_tags:
    - linux
    - logrotate
    - log
    - rotate
    - ubuntu
    - debian
    - redhat
    - suse
