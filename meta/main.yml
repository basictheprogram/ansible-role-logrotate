---
# No role dependencies — this role is self-contained.
# Previously depended on realtime.logrotate_core, which has been consolidated
# into this role as of 2026-05-21.
dependencies: []

galaxy_info:
  namespace: realtime
  author: "Bob Tanner"
  role_name: logrotate
  description: >
    Install and configure logrotate: /etc/logrotate.conf, per-application
    drop-ins under /etc/logrotate.d, and wtmp/btmp rotation, validated with
    logrotate --debug before they are written. For Debian (trixie), Ubuntu
    (jammy, noble, resolute), EL (9: Rocky, Alma, RHEL) and SUSE/openSUSE
    Leap. Fork of arillso/ansible.logrotate
    (https://github.com/arillso/ansible.logrotate), taken over 2026-05-21
    following upstream archival.
  issue_tracker_url: https://github.com/basictheprogram/ansible-role-logrotate/issues
  license: "MIT"
  min_ansible_version: "2.20"
  galaxy_tags:
    - linux
    - logrotate
    - log
    - logs
    - rotate
    - wtmp
    - btmp
    - cron
    - ubuntu
    - debian
    - redhat
    - rocky
    - almalinux
    - suse
    - opensuse
