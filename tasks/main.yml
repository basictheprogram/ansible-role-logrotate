---
# tasks file for realtime.logrotate
#
# Fork of arillso/ansible.logrotate (https://github.com/arillso/ansible.logrotate)
# Maintained by Bob Tanner (fork taken over 2026-05-21)

- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - "{{ ansible_facts['system'] }}.yml"
      paths:
        - "vars"
      errors: ignore
  tags: logrotate

- name: Include tasks for Debian/Ubuntu
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts['os_family'] == 'Debian'
  tags: logrotate

- name: Include tasks for SUSE/openSUSE
  ansible.builtin.include_tasks: suse.yml
  when: ansible_facts['os_family'] in ['Suse', 'openSUSE Leap', 'openSUSE Tumbleweed']
  tags: logrotate

- name: Include tasks for Red Hat / Rocky / Alma
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == 'RedHat'
  tags: logrotate

# logrotate exits 1 with "duplicate log entry" when a log is defined in
# logrotate.conf and again in a drop-in. Newer Debian/Ubuntu packages ship
# /etc/logrotate.d/wtmp and btmp, so those blocks are only written here when
# no drop-in already owns the log. The excludes are logrotate's own ignored
# file extensions (tabooext).
- name: Find drop-ins that already rotate the wtmp and btmp logs
  become: true
  ansible.builtin.find:
    paths: "{{ logrotate_include_dir }}"
    excludes:
      - "*~"
      - "*.cfsaved"
      - "*.disabled"
      - "*.dpkg-*"
      - "*.rhn-cfg-tmp-*"
      - "*.rpmnew"
      - "*.rpmorig"
      - "*.rpmsave"
      - "*.swp"
    contains: >-
      ^[^#]*(^|[\s"'])({{ logrotate_owned_log.logs | map('regex_escape') | join('|') }})([\s{"']|$)
    follow: true
  loop:
    - "{{ logrotate_wtmp }}"
    - "{{ logrotate_btmp }}"
  loop_control:
    loop_var: logrotate_owned_log
    label: "{{ logrotate_owned_log.logs | join(' ') }}"
  register: __logrotate_dropin_owners
  when: logrotate_global_config | bool
  tags: logrotate

- name: Decide which of wtmp and btmp logrotate.conf defines itself
  ansible.builtin.set_fact:
    __logrotate_render_wtmp: >-
      {{ logrotate_wtmp_enable | bool and
         __logrotate_dropin_owners.results[0].matched == 0 }}
    __logrotate_render_btmp: >-
      {{ logrotate_btmp_enable | bool and
         __logrotate_dropin_owners.results[1].matched == 0 }}
  when: logrotate_global_config | bool
  tags: logrotate

- name: Create logrotate global configuration
  become: true
  ansible.builtin.template:
    src: "etc/logrotate.conf.j2"
    dest: "/etc/logrotate.conf"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/logrotate --debug %s"
  when: logrotate_global_config | bool
  tags: logrotate

- name: Create per-application logrotate configs
  become: true
  ansible.builtin.template:
    src: "etc/logrotate.d/application.j2"
    dest: "{{ logrotate_include_dir }}/{{ logrotate_application.name }}"
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/logrotate --debug %s"
  loop: "{{ logrotate_applications }}"
  tags: logrotate

# The same check logrotate.service runs nightly. Catches what the per-file
# validation cannot, such as two drop-ins defining the same log.
  loop_control:
    loop_var: logrotate_application
    label: "{{ logrotate_application.name }}"
- name: Verify logrotate accepts the final configuration
  become: true
  ansible.builtin.command:
    cmd: /usr/sbin/logrotate --debug /etc/logrotate.conf
  changed_when: false
  when: not ansible_check_mode
  tags: logrotate

- name: Create hourly cron symlink for logrotate
  become: true
  ansible.builtin.file:
    path: "/etc/cron.hourly/logrotate"
    src: "/etc/cron.daily/logrotate"
    state: link
  when: logrotate_use_hourly_rotation | bool
  tags: logrotate
